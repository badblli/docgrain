[project]
name = "docgrain-records"
version = "0.0.1"
description = "Workspace collection discovery and evidence-verified records from normalized documents"
requires-python = ">=3.12"
dependencies = ["docgrain-domain", "docgrain-eval", "httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
graph = ["docling-graph==1.9.1", "litellm==1.82.6"]

[project.scripts]
docgrain-records = "docgrain_records.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docgrain_records"]
