[project]
name = "docgrain-access"
version = "0.0.1"
description = "Read-only published collection tools and MCP stdio access"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
docgrain-mcp = "docgrain_access.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docgrain_access"]
