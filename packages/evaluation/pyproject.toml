[project]
name = "docgrain-eval"
version = "0.0.1"
description = "Deterministic evaluation of published Docgrain knowledge"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]

[project.scripts]
docgrain-eval = "docgrain_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docgrain_eval"]
