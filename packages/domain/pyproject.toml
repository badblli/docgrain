[project]
name = "docgrain-domain"
version = "0.0.1"
description = "Vendor-neutral domain models and job state machine for Docgrain"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docgrain_domain"]
