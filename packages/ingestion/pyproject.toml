[project]
name = "docgrain-ingestion"
version = "0.0.1"
description = "Load a company folder through the Docgrain API"
requires-python = ">=3.12"
dependencies = ["docgrain-domain", "httpx>=0.27"]

[project.scripts]
docgrain = "docgrain_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docgrain_ingest"]
