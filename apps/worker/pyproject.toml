[project]
name = "docgrain-worker"
version = "0.0.1"
description = "Docgrain multi-format structural parsing and legacy PDF extraction worker"
requires-python = ">=3.12"
dependencies = [
    "docling==2.130.0",
    "easyocr==1.7.2",
    "docgrain-domain",
    "docgrain-api",
    "openpyxl>=3.1,<4",
    "google-genai>=2.6,<3",
    "minio>=7.2",
    "pydantic>=2.12,<3",
    "pymupdf>=1.24",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docgrain_worker"]

[tool.uv.sources]
docgrain-domain = { path = "../../packages/domain", editable = true }
docgrain-api = { path = "../api", editable = true }
