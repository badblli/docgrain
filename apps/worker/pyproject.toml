[project]
name = "docgrain-worker"
version = "0.0.1"
description = "Docgrain durable pipeline worker"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2", "redis>=5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docgrain_worker"]
