[project]
name = "docgrain-api"
version = "0.0.1"
description = "Docgrain HTTP API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "minio>=7.2",
  "python-multipart>=0.0.20",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "docgrain-domain",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.uv.sources]
docgrain-domain = { path = "../../packages/domain", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docgrain_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
