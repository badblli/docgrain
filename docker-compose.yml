name: docgrain

services:
  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docgrain}
      POSTGRES_USER: ${POSTGRES_USER:-docgrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-docgrain}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-locally}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-docgrain} $${MINIO_ROOT_PASSWORD:-change-me-locally}; do sleep 1; done;
      mc mb --ignore-existing local/$${S3_BUCKET:-docgrain};
      mc version enable local/$${S3_BUCKET:-docgrain};
      mc anonymous set private local/$${S3_BUCKET:-docgrain}"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-docgrain}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-locally}
      S3_BUCKET: ${S3_BUCKET:-docgrain}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}

  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Optional local server credentials, including arbitrary profile api_key_env names.
    env_file:
      - path: .env
        required: false
    environment:
      DOCGRAIN_ENV: ${DOCGRAIN_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://docgrain:change-me-locally@postgres:5432/docgrain}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-docgrain}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-docgrain}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-locally}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      USE_FIXTURES: ${USE_FIXTURES:-false}
      CANONICAL_PERSISTENCE_ENABLED: ${CANONICAL_PERSISTENCE_ENABLED:-true}
      RECORDS_PUBLICATION_ROOT: ${RECORDS_PUBLICATION_ROOT:-/srv/storage/records}
      # Inherit when supplied; otherwise Settings keeps its empty {} default.
      DOCGRAIN_MODEL_CREDENTIAL_PROFILES:
    volumes:
      - ./storage/records:/srv/storage/records:rw
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WORKSPACE_ID: ${NEXT_PUBLIC_WORKSPACE_ID:-ws_local}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WORKSPACE_ID: ${NEXT_PUBLIC_WORKSPACE_ID:-ws_local}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://docgrain:change-me-locally@postgres:5432/docgrain}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-docgrain}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-docgrain}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-locally}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      CANONICAL_PERSISTENCE_ENABLED: ${CANONICAL_PERSISTENCE_ENABLED:-true}
      DOCGRAIN_OCR_ENABLED: ${DOCGRAIN_OCR_ENABLED:-true}
      DOCGRAIN_DOCLING_MODEL_DIR: /opt/docling-models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DOCGRAIN_NATIVE_FIDELITY_ENABLED: ${DOCGRAIN_NATIVE_FIDELITY_ENABLED:-true}
      DOCGRAIN_REMOTE_VISION_ENABLED: ${DOCGRAIN_REMOTE_VISION_ENABLED:-false}
      USE_FIXTURES: ${USE_FIXTURES:-false}
      DOCGRAIN_INTERNAL_API_URL: http://api:8000
      RECORDS_PUBLICATION_ROOT: ${RECORDS_PUBLICATION_ROOT:-/srv/storage/records}
      DOCGRAIN_MODEL_CREDENTIAL_PROFILES:
    volumes:
      - ./storage/records:/srv/storage/records:rw
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
