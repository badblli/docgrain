name: Quality

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install API and test dependencies
        run: python -m pip install -e 'packages/domain[validation]' -e packages/records -e 'apps/api[dev]' 'pymupdf>=1.24'
      - name: Ruff
        run: ruff check apps packages tests benchmarks docs/examples
      # pytest.ini exposes worker source for pure unit tests. Real parser/SDK
      # integration requires the worker dependencies and is not covered here.
      - name: Unit and mode-isolation tests
        run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run build
