name: Quality

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install API and test dependencies
        run: python -m pip install -e packages/domain -e 'apps/api[dev]'
      - name: Ruff
        run: ruff check apps packages tests
      - name: Contract tests
        run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm install
      - run: npm run build
